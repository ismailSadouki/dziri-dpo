run:
  name: qwen15b_darija_stage4_data50
  seed: 42

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  mode: qlora_nf4

lora:
  r: 16
  target_modules: all-linear

data:
  train: data/splits/train_50pct.jsonl
  validation: data/splits/val.jsonl
  max_length: 512

training:
  num_train_epochs: 1
  max_steps: 100
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 1

output:
  root: outputs/sft_stage4_data50