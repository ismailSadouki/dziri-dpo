run:
  name: qwen15b_darija_sft_baseline
  seed: 42

model:
  name: Qwen/Qwen2.5-1.5B-Instruct

data:
  train: data/splits/train.jsonl
  validation: data/splits/val.jsonl
  max_length: 512

training:
  num_train_epochs: 1
  max_steps: -1

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0

  gradient_checkpointing: true
  bf16: true

  logging_steps: 1
  eval_strategy: steps
  eval_steps: 25

  save_strategy: steps
  save_steps: 25
  save_total_limit: 2

output:
  root: outputs/sft